name = "slt"
main = "./worker.ts"
compatibility_date = "2025-04-08"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

pages_build_output_dir = ".open-next/assets"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "slt"

[triggers]
crons = ["0 9 * * *"]
